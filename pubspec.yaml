name: afetnet
description: "AfetNet — Canlı Kriz Yönetimi ve Acil Yardım Ağı"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  firebase_messaging: ^16.7.1
  firebase_crashlytics: ^5.4.1
  firebase_analytics: ^12.6.1
  provider: ^6.1.5+1
  go_router: ^18.1.4
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  shared_preferences: ^2.5.6
  geolocator: ^14.0.1
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geoflutterfire_plus: ^0.0.34
  flutter_local_notifications: ^23.0.1
  connectivity_plus: ^7.3.2
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3
  mask_text_input_formatter: ^2.9.0
  intl: ^0.20.3
  uuid: ^4.6.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  # Yazı tipleri gömülüdür, internetsiz çalışır (§3.4). Lisans: assets/fonts/OFL-*.txt
  assets:
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
